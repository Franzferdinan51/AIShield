# AI Shield targets — the machines the program should scan.
#
# The program ships with NO built-in targets. "local" (this machine)
# always works with zero configuration. Define your other machines in
# config/hosts.local.yaml (untracked — real addresses never belong in
# version control) or via AISHIELD_HOST_<NAME>=user@host[:port] env vars.
#
# Example hosts.local.yaml:
#
#   workstation:
#     os: linux            # linux | macos | windows
#     host: "192.0.2.10"   # IP or hostname (e.g. a VPN/tailnet address)
#     user: "alice"
#     port: 22
#     identity: "~/.ssh/id_ed25519"
#     proxy: "none"        # or "env" / "env:<port>" to route ssh through
#                          # an HTTP CONNECT proxy from HTTPS_PROXY
#
# Then: aishield scan workstation
