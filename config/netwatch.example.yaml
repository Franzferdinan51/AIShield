# AI Shield Netwatch — copy to netwatch.local.yaml and edit.
# (The shield writes netwatch.local.yaml itself the first time you
# block a source; this file is only a template.)
#
# blocked: public IPs on your blocklist. The GUI/CLI/MCP add to it
# when you block a source. Firewall rules are generated from it into
# data/netwatch-apply.sh (or .ps1).
blocked: []
